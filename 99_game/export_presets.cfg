; 他者之镜 导出预设 —— Steam(Windows) + Web 两端。
; 渲染器统一 GL Compatibility（见 project.godot）：Galgame 不吃高级渲染，Web 端仅支持此项。
;
; 用法：Godot 编辑器打开本工程 → 项目 → 导出，即可见下方两个预设；首次需先"编辑器 → 管理导出模板 → 下载"。
;   - Steam：导出 preset.0 → builds/windows/他者之镜.exe（pck 嵌入 exe，单文件上传 Steam）
;   - Web ：导出 preset.1 → builds/web/index.html（threads 关闭，部署无需 COOP/COEP 跨域隔离头）
;
; Web 分包（章节多、首包过大时启用）：
;   本预设当前 export_filter="all_resources"（全资源进主包，V1 简单可跑）。
;   要按章分包：把 export_filter 改为 "customized"，用 exclude_filter 排除 "chapters/*" 等章资源，
;   再依 data/chapter_packs.json + data/manifest.json 把每章资源打成 <stem>.pck（内部用全局 assets/ 路径），
;   与 index.html 同目录托管，运行时由 ChapterPackLoader 按需下载挂载。

[preset.0]

name="Steam (Windows Desktop)"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/windows/他者之镜.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

