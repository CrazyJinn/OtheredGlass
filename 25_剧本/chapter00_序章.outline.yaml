# 序章提纲（chapter00 · 纯线性，无 Choice）
# 拓扑骨架（meta/scenes/lines 流程指令）+ authoring 人读引导块
# authoring 块不进定稿，仅供 chapter-dialoguer 参考
# 落盘：chapter-outliner；覆盖旧的基于最新 event 重产

meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
      - "伊芙"
    scenes:
      - "酒店-客房"
      - "马路-路口"
      - "灵魂夹缝-夹缝空间"

# ──────────────────────────────────────────────
# authoring 人读引导块（不进定稿）
# ──────────────────────────────────────────────
authoring:
  direction: "陆择现代生活的最后一晨：酒店客房醒来，对一夜情对象顾盈的示好（加微信）用『马上要离开这座城市』作借口推开并逃离；雨天路口过马路时遭遇车祸当场身亡——情感硬翻转；灵魂剥离后落入通透明亮的过渡空间『灵魂夹缝』，伊芙以天使引路人身份现身，宣告试炼规则（六个试炼、每个 30 天、灵魂穿越拯救弱者、只能在关键选择处干预）。本章是整部作品的现实起点与机制锚点，为 chapter 01（陈默跳江 / 灵魂穿越）做直接衔接。"
  emotion_arc:
    start: "轻疏离 / 尴尬逃避（酒店客房，清晨宿醉，情绪温度低、节奏慢）"
    turning_point: "猝然惊愕 / 谷底（车祸——生→死的硬翻转，不可蒙太奇软化）"
    end: "明亮中的茫然 + 被赋予使命的微妙重量（灵魂夹缝的治愈通透与陆择的茫然并存，被塞进比活着更大的命题里的轻微失重）"
  constraints:
    - "本章无玩家选择点（Choice），纯线性骨架；车祸与伊芙告知规则都是确定性事件，禁止虚晃分支。"
    - "30 秒内让玩家对陆择形成鲜明人设印象：疏离、疲惫、用『离开这座城市』作借口切断一夜情后续的拒绝连接型都市青年。"
    - "车祸必须猝不及防——从轻尴尬的清晨氛围直接跌入确定的死亡，不可用蒙太奇 / 慢镜头 / 内心独白软化。要让玩家『啊？』一下。"
    - "试炼机制必须揭示得干净、无歧义：六个试炼、每个 30 天、灵魂穿越拯救弱者、只能在关键选择处干预。这是整部作品玩法根基。"
    - "对伊芙保持好奇与微妙不信任——她的动机 / 立场 / 信息来源必须留白，是长期关系对象，不是工具人 NPC。"
    - "陆择的每一句都应折射他对『连接』的回避或被迫靠近（核心主题问题：拒绝连接者在死后被塞进『拯救陌生灵魂』的使命）。"
    - "节奏：前段（酒店）慢、转折（车祸）快而硬、后段（夹缝）稳——对齐设计简报情感弧线。"

# ──────────────────────────────────────────────
# 场景段（纯线性，靠 jump 串联）
# ──────────────────────────────────────────────
scenes:
  - id: "酒店醒来"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "清晨宿醉"
      mode: "play"
      loop: true
    authoring:
      purpose: "建立陆择人设（疏离 / 拒绝连接）+ 呈现与顾盈的一夜情尴尬清晨。让玩家在 30 秒内嗅出『拒绝连接』的生活状态。"
      beats:
        - "陆择宿醉头痛醒来，环境感先入：冷白晨光、凌乱床铺、散落衣物、卫浴区水声。"
        - "顾盈穿着陆择的白衬衫在洗漱，回过头自然地搭话——她态度松弛、不扭捏。"
        - "顾盈夸赞陆择昨晚表现，主动提议加个微信（连接的姿态）。"
        - "陆择用『我马上要离开这座城市』作借口推开——语气不粗鲁，但温度明确降低。"
        - "顾盈微微一愣，随即恢复体面，礼貌收尾；陆择趁机快速收拾逃离客房。"
        - "离开时陆择有一瞬轻微愧疚，但立刻压下去——强化『切断连接是本能』。"
      motif_anchors:
        - "白衬衫（顾盈穿男主的）：暧昧的局促物理证据。"
        - "手机 / 微信二维码：被拒绝的连接符号。"
        - "清晨冷白光 + 冷灰环境光：疏离感的视觉化。"
      transition: "客房门关上的闷响 → 画面切到雨天路口；节奏从慢推到急。"
    lines:
      - op: "jump"
        scene: "车祸身亡"

  - id: "车祸身亡"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨街"
      mode: "play"
      loop: true
    authoring:
      purpose: "让死亡猝不及防——情感弧线的硬翻转点。从轻尴尬的清晨氛围直接跌入确定的死亡，不可软化。"
      beats:
        - "陆择走出酒店，雨天城市路口扑面：雨幕、湿沥青、霓虹与车灯的冷光倒影、积水洼里破碎的街景。"
        - "陆择思绪游离——刚切断了顾盈的连接，内心还在压那份轻微愧疚，注意力没在路上。"
        - "红灯变绿灯，陆择随人群迈步过斑马线。"
        - "毫无预警——车祸骤然降临（不是慢镜头，不是内心独白，是猝不及防的硬切）。"
        - "画面 / 声音断点：黑暗、静默或尖锐刹车的余响，强调虚无感。"
        - "确认死亡（不复活、不抢救、不梦醒）——这是不可挽回的物理断点。"
      motif_anchors:
        - "雨幕：死亡的物理氛围。"
        - "积水洼倒影：破碎的现实镜像（陆择『破碎的连接』的视觉转译）。"
        - "红绿灯 / 车灯：命运的红绿、不可干预的确定性。"
      transition: "黑暗硬切 → 灵魂夹缝的明亮虚空；视觉与情感双重硬翻转（冷雨夜 → 暖白光）。"
    lines:
      - op: "jump"
        scene: "夹缝相遇"

  - id: "夹缝相遇"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "光隙"
      mode: "play"
      loop: true
    authoring:
      purpose: "揭示试炼机制 + 引出伊芙。整部作品玩法的根基在此交代干净；同时让玩家对伊芙产生好奇与微妙不信任（动机 / 立场留白）。"
      beats:
        - "陆择灵魂剥离，缓慢睁眼——明亮通透的空间：柔和白光、飘散的光粒、治愈通透。"
        - "短暂茫然——他意识到自己刚死了，但没有痛苦，只有失重感。"
        - "伊芙现身（天使灵魂引路人身份），态度温和但不卑微，语气有距离感。"
        - "伊芙告知试炼规则（清晰、无歧义）：六个试炼、每个 30 天、灵魂穿越去拯救弱者、只能在关键选择处干预。"
        - "陆择试图提问（为什么是我？你是谁？拯救失败会怎样？）——伊芙的回答部分揭示、部分留白。"
        - "伊芙宣告第一个试炼即将开始（为 chapter 01 陈默跳江 / 灵魂穿越做直接衔接钩子）。"
        - "陆择带着茫然 + 微妙的不信任 + 被赋予使命的重量，接受这个新的『死后』稳态。"
      motif_anchors:
        - "光粒 / 光雾：灵魂空间的物质性。"
        - "伊芙的羽翼 / 光环（若有视觉呈现）：天使引路人身份的符号。"
        - "明亮虚空：死后世界的开放性（与酒店的逼仄客房对照）。"
      transition: "本场为序章自然收束——规则讲完、使命交接，玩家点击退出后由前端进入 chapter 01。"
    lines: []
