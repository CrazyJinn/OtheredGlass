meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
      - "伊芙"
    scenes:
      - "酒店-客房"
      - "马路-路口"
      - "灵魂夹缝-夹缝空间"

scenes:
  - id: "酒店"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "晨离"
      mode: "play"
      loop: true
    lines: []
    authoring:
      purpose: "建立陆择人设——拒绝连接的都市青年；让玩家在30秒内嗅到宿醉清晨的局促尴尬。情绪温度低、节奏慢，铺垫本章的轻疏离起点。"
      beats:
        - "陆择宿醉醒来，意识在陌生酒店客房里逐渐回归；窗外清晨冷白偏蓝的自然光透入。"
        - "浴室方向传来水声——顾盈正穿着陆择的白衬衫洗漱（白衬衫被她一夜穿走，这是陆择此刻赤裸上身的合理化因果）。"
        - "顾盈从浴室出来，带着轻佻与熟稔评价昨夜，掏出手机想加陆择微信（一次连接的尝试）。"
        - "陆择以'我马上要离开这座城市'为借口把这一夜定性为不需要后续的偶然，温和地推开加微信（拒绝连接的本能）。"
        - "陆择匆忙收拾离开客房，把顾盈留在身后；节奏保持慢、压抑，情绪不升温。"
      motif_anchors:
        - "白衬衫（被顾盈穿走——昨夜的连接被对方占据，陆择失去遮蔽）"
        - "赤裸上身（陆择的脆弱与欲念状态，世俗身份的第一层剥离）"
      transition: "陆择穿上商务休闲套装的剩余部分（燕麦卡其开衫、深灰长裤、皮带、皮鞋；开衫内无衬衫，因白衬衫已被顾盈穿走）离开酒店。情绪由尴尬逃避转入逃离途中的麻木行走，画面衔接阴雨天的城市路口。"

  - id: "路口"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨路"
      mode: "play"
      loop: true
    lines: []
    authoring:
      purpose: "打破玩家对'都市日常开场'的预期——本章唯一的情绪硬翻转（turning point）。车祸必须快而硬，不能用蒙太奇软化，要让玩家'啊？'一下。"
      beats:
        - "阴雨天，湿滑的城市路口；霓虹与车灯在积水洼里晕开冷光。陆择穿着商务休闲装（开衫内无衬衫）撑伞或冒雨走在斑马线一侧等红灯。"
        - "红灯变绿，行人涌出，陆择随人流过马路；节奏仍延续上段的麻木与日常感。"
        - "一辆失控车辆在雨幕中冲出（描写猝然，不给玩家反应时间，不渲染生死瞬间的心里独白）。"
        - "车祸发生——陆择当场身亡。节奏必须快而硬，死亡在两三句内落定。"
        - "画面骤然黑场（或短暂的雨声白噪），作为情绪硬翻转的视觉/听觉锚点。"
      motif_anchors:
        - "商务休闲装（社交体面、都市身份的最后外壳；开衫内无衬衫，暗示身份已是空壳）"
        - "雨水（洗刷/净化的过渡意象）"
        - "霓虹与车灯的湿地倒影（破碎的都市幻象）"
      transition: "灵魂从躯体剥离，画面从雨夜黑场转入明亮通透的灵魂夹缝空间；陆择的着装同步从商务休闲蜕变为云雾蔽体，完成世俗身份剥离隐喻弧的最后一跳。"

  - id: "夹缝"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "光隙"
      mode: "play"
      loop: true
    lines:
      - op: "jump"
        file: "chapter01_新皮肤"
    authoring:
      purpose: "揭示试炼机制（整部作品玩法的根基）+ 引出伊芙作为长期关系对象；为 chapter 01（陈默跳江/灵魂穿越）做直接衔接。终点情绪：明亮中的茫然 + 被赋予使命的微妙重量。"
      beats:
        - "陆择的灵魂在夹缝空间苏醒——着装已彻底脱离世俗，变为云雾蔽体（流动的白云环绕身体、自然遮挡重点部位，赤足）。"
        - "伊芙以天使灵魂引路人身份现身（月白薄纱天使裙、穿衣、神圣有序），与陆择的云雾蔽体形成'她穿衣 / 他云蔽'的对比——一个仍属秩序之内，一个已褪尽世俗。"
        - "伊芙平静地告知陆择他已经死了；陆择在明亮通透的治愈感与自身的茫然之间失重。"
        - "伊芙揭示试炼规则：六个试炼、每个30天、灵魂穿越去拯救弱者、且只能在关键选择处干预（机制揭示必须干净、无歧义）。"
        - "伊芙对自身动机、立场、信息来源留白——她不是工具人 NPC，是长期关系对象，玩家应产生好奇与微妙不信任。"
        - "伊芙宣告陆择的第一个试炼即将开始，画面淡出，无缝衔接 chapter 01。"
      motif_anchors:
        - "云雾蔽体（褪尽世俗的本真，世俗身份剥离隐喻弧的终点）"
        - "伊芙穿衣 vs 陆择云蔽（神圣有序 vs 灵魂本真的对照）"
        - "光粒与暖白光（治愈通透的'死后'稳态；与雨夜车祸的冷蓝形成冷暖反转）"
      transition: "jump file 跳转 chapter01_新皮肤，把玩家从伊芙宣告的瞬间无缝送入第一个试炼（陈默跳江 / 灵魂穿越）。"

authoring:
  direction: "纯线性叙事——无玩家选择点（车祸与伊芙告知规则均为确定性事件，分支玩法从 chapter 01 才开始）。本章是整部作品的现实起点与机制锚点：以陆择现代生活的最后一晨起笔（酒店尴尬清醒 → 借口逃离），经骤然的雨天车祸身亡（情绪硬翻转），落到灵魂夹缝中伊芙以引路人身份揭示试炼规则，为 chapter 01 做直接衔接。核心戏剧职责是：建立陆择人设（拒绝连接的都市青年）+ 揭示世界观（现代现实 → 死后灵魂夹缝 → 试炼穿越）+ 立起'拯救弱者'母题。三套着装（酒店赤裸 → 马路商务休闲 → 灵魂夹缝云雾蔽体）构成世俗身份层层剥离的隐喻弧，必须在场景衔接处自然落地。"
  emotion_arc: "起点（轻疏离 / 尴尬逃避，酒店清晨）→ 中段转折（猝然惊愕 / 谷底，车祸死亡的虚无断点，本章唯一情绪硬翻转）→ 终点（明亮中的茫然 + 被赋予使命的微妙重量，夹缝空间的治愈'死后'稳态）。节奏：前段（酒店）慢，转折（车祸）必须快而硬，后段（夹缝）稳。"
  constraints:
    - "本章无 Choice（车祸与伊芙告知规则都是确定性事件）；纯线性拓扑，禁止自造分支。"
    - "车祸必须猝然、快而硬——不能用蒙太奇、慢镜头或内心独白软化；死亡在两三句内落定。"
    - "试炼规则揭示必须干净、无歧义：六个试炼、每个30天、灵魂穿越拯救弱者、只能在关键选择处干预。"
    - "陆择的每一句台词都应折射他对'连接'的回避或被迫靠近——保持主题一致。"
    - "三套着装的隐喻弧必须在场景衔接处自然交代，不可突兀：酒店赤裸（白衬衫被顾盈穿走，因果已在事件素材里）→ 马路商务休闲（顾盈只穿走白衬衫一件，套装其余部分——燕麦卡其开衫、深灰长裤、皮带、皮鞋——陆择穿上离开酒店，开衫内无衬衫）→ 灵魂夹缝云雾蔽体（彻底脱离世俗衣物，流动白云环绕身体遮挡重点部位，赤足）。"
    - "伊芙的动机、立场、信息来源必须留白——她是长期关系对象，不是工具人 NPC；玩家应产生好奇与微妙不信任。"
    - "伊芙（月白薄纱天使裙、穿衣、神圣有序）与陆择云雾蔽体（褪尽世俗、赤足）的'她穿衣 / 他云蔽'对比必须在夹缝段自然呈现。"
    - "结尾用 jump file chapter01_新皮肤 直接衔接 chapter 01（陈默跳江 / 灵魂穿越），不使用 ending。"
