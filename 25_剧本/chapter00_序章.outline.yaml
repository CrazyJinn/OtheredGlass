meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
    scenes:
      - "酒店-客房"
      - "马路-路口"

authoring:
  direction: "序章是全作现实起点——陆择在酒店客房中宿醉醒来，与一夜情对象顾盈进行尴尬晨间对话；他用『手机没电』为借口逃离亲密关系，走到喧嚣街头。在过马路的一瞬被车撞死。整章在 5–10 分钟内完成从『麻木日常』到『骤然死亡』的类型切换，为下一章灵魂穿越/试炼机制建立反差锚点。纯线性无分支，无玩家选择点。"
  emotion_arc: "start 宿醉麻木 + 一夜情轻微羞耻 → mid 逃避式周旋（借口逃离成功，短暂轻松 + 一丝空虚） → turn 街头走神（绿灯迈步，脑袋空空） → ⚡climax 车祸瞬间（毫无防备，沉默 + 黑屏承担情绪） → end 悬置（无情绪收束，留 chapter 01 接）"
  constraints:
    - "车祸瞬间保持克制：禁出现『啊！』『我…要死了？』等内心独白/惊呼台词；让 bgm fade + sfx + 黑屏 narrate 承担情绪。"
    - "『逃离』母题显式呈现：陆择用『手机没电』为借口必须在酒店段通过具体对话/独白显式呈现（不止旁白带过），让玩家意识到这是他面对亲密/尴尬的本能模式。"
    - "现实质感（反差锚点）：用酒店标准客房、白衬衫、清晨冷光、车流喧嚣、斑马线红绿灯等具体细节建立『这就是真实世界』的信念——为后续灵魂穿越提供反差。"
    - "本章不含 chapter 01 内容：禁止长江大桥跳江、伊芙试炼规则、陈默出现等。序章严格止于『车祸身亡 + 黑屏悬置』。"
    - "保持拓扑不变：2 个 scene-block（宿醉醒来 → 车祸瞬间）+ 1 个 jump 串联；不拆新 scene、不加 Choice。"
    - "末段死亡后如何收尾交 dialoguer 决定：可用 narrate 黑屏 / bgm fade / sfx 刹车声等；倾向不加跨章 jump，让文件自然结束。"
    - "声音一致：陆择用『呵』『这个嘛…』『随意』等周旋腔（表面温和、骨子里逢迎）；顾盈用『嗯？』『是吗』反问腔（世故妩媚、不示弱）。"

scenes:
  - id: "宿醉醒来"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "宿醉清晨"
      mode: "play"
      loop: true
    lines:
      - op: "jump"
        scene: "车祸瞬间"
    authoring:
      purpose: "建立陆择『现代都市倦怠青年』人设 + 顾盈作为『被逃避的亲密关系』的具象化载体；显式呈现『手机没电』逃离母题。完成情感弧线的 start→mid 段（麻木→周旋式逃避）。"
      beats:
        - "开篇环境质感：清晨冷白光、浴室水声、床头柜上两只空酒杯——建立『这就是真实世界』。"
        - "陆择宿醉醒来，太阳穴突跳，盯着天花板——身体性的倦怠感，不出台词。"
        - "顾盈擦着头发走出卫浴区，穿着陆择昨夜随手脱下的白衬衫（松松垮垮）——暧昧的具象化 + 一夜情事实。"
        - "顾盈挑逗式开场（『醒了？挺能睡啊』），陆择用『呵…有点累』周旋式回应。"
        - "顾盈进一步挑逗（『昨晚你倒是挺来劲的，嗯？』），陆择用『这个嘛…喝多了难免』推托。"
        - "陆择摸床头柜——手机不在——主动询问『我手机呢？』"
        - "顾盈告知『桌上。没电了，自己关了』——关键信息抛出。"
        - "陆择伸手够到那块黑屏，指节顿了一下——逃离契机浮现（动作暗示，不出内心独白）。"
        - "陆择顺势抛出借口：手机没电 → 公司那边催得急 → 回头咖啡我请（虚假承诺，轻飘飘周旋腔）。"
        - "顾盈反问『嗯？这么急』——看穿但不戳破。"
        - "陆择模糊推托『项目上的烂事，没办法』。"
        - "顾盈接受，挑衅式收一句『行吧。白衬衫我先穿着了』。"
        - "陆择『随意』冷淡式慷慨收尾。"
        - "顾盈离场（hide），陆择抓起外套连头也不回推门——逃离完成。"
      motif_anchors:
        - "白衬衫（穿在顾盈身上）：昨夜亲密的证据，被她主动占有；陆择的『随意』是放弃追溯，象征他对亲密的撤离。"
        - "黑屏手机（第一次出现）：陆择的『救命稻草』——他需要手机作为借口；手机不在手 → 主动询问 → 发现关机 → 顺势借口。象征他对『出口』的敏锐嗅觉。"
        - "两只空酒杯并排：昨夜事实的证据，无需言说的尴尬；现实的冷感锚点。"
      transition: "bgm fade（『宿醉清晨』渐弱）+ jump 到「车祸瞬间」；时间从清晨切到白天，空间从封闭客房切到开放街头，情绪从暧昧尴尬切到短暂轻松。"

  - id: "车祸瞬间"
    scene: "马路-路口"
    time: "白天"
    bgm:
      track: "喧嚣街头"
      mode: "play"
      loop: true
    lines: []
    authoring:
      purpose: "建立现实质感（喧嚣街头）→ 街头走神 → ⚡车祸死亡瞬间（克制处理）→ 黑屏悬置。完成情感弧线的 mid→turn→⚡climax→end 段（短暂轻松→走神→死亡震撼→悬置），把玩家从『日常』推入『不存在』，为 chapter 01 灵魂穿越打开类型切换。"
      beats:
        - "街头环境质感：酒店门口凉风 + 陆择把外套领子拢了拢 + 长长吐出一口气——逃离后的短暂轻松。"
        - "陆择一句台词『呵……又是这一套』——建立逃避式轻快，把刚才的尴尬归类为『日常套路』。"
        - "更具体的现实质感（旁白）：对面早餐店冒热气、红绿灯在头顶切换、斑马线上的人来来去去谁也没多看谁一眼——平常得令人毫无防备。"
        - "陆择按手机（屏幕没亮）随手塞回口袋——昨夜的尾巴随手归档，第二次出现黑屏手机母题。"
        - "show 陆择.走神立绘——情绪开始飘离（用立绘切换传达，不出内心独白）。"
        - "旁白：绿灯亮了，他随人流迈下路缘石——最后一个平常的决策。"
        - "bgm fade（『喧嚣街头』渐弱）——世界开始撤离。"
        - "sfx 急刹 + sfx 闷响——感官层面，非语言；死亡在听觉里发生，不在台词里。"
        - "hide 陆择——视觉缺席，玩家认知断层。"
        - "narrate『——』（破折号 = 静默）+ narrate『之后的事情，陆择没有看见。』——第三人称收束，告知玩家他的视角到此为止；克制不写内心独白/惊呼。"
      motif_anchors:
        - "喧嚣街头：与酒店客房的封闭暧昧形成强反差；越平常越能反衬死亡的毫无防备。"
        - "黑屏手机（第二次出现）：再次按手机屏幕没亮，象征他与世界的连接始终是『关闭』的——既是借口（没电→逃离），也是预兆（与世界的通讯终将切断）。"
        - "绿灯：最后一件『正常』的事物；他没有做错任何事，死亡不是他的选择——这是全作『死亡不可控』母题的序章设问。"
      transition: "本章末尾——文件自然结束（不加跨章 jump）。chapter 01 接入由运行时/publisher 处理；本章止于『陆择没有看见』的悬置，把『之后呢？』留给下一章。"
