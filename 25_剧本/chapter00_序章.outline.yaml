meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
      - "伊芙"
    scenes:
      - "酒店-客房"
      - "马路-路口"
      - "灵魂夹缝-夹缝空间"

authoring:
  direction: "陆择现代生活的最后一晨：在酒店客房醒来后，借口马上要离开这座城市而逃离一夜情对象顾盈，逃离途中过马路遭遇车祸当场身亡；死后灵魂滞留于过渡空间「灵魂夹缝」，伊芙以天使灵魂引路人身份现身，告知试炼规则（六个试炼、每个 30 天、灵魂穿越拯救弱者、且只能在关键选择处干预），为第一章灵魂穿越至陈默做直接衔接。纯线性叙事，无玩家选择点。"
  emotion_arc:
    start: "宿醉清晨的尴尬疏离（冷蓝·酒店客房）"
    fall: "逃离成功后短暂轻松，随即被车祸骤然打断"
    nadir: "马路路口车祸身亡，情绪坠落至死亡真空（冷灰·雨幕）"
    turn: "灵魂夹缝的暖白光明与伊芙现身（暖白·夹缝空间）"
    end: "使命沉重与重获意义的复杂张力——死亡被重新定义为另一种开始"
  constraints:
    - "陆择逃离酒店客房的借口表述必须严格统一为「马上要离开这座城市」，不得替换、增补或弱化为任何其他借口理由——该借口是 Event 与 Info 节点明定的最新版本，是全章因果链的固定锚点。"
    - "车祸必须骤然降临、不可预告、不可逆，强化「日常与死亡并置」的震撼，不得给玩家任何避险提示或伏笔铺垫。"
    - "伊芙告知试炼规则必须完整覆盖四个要素：六个试炼、每个 30 天、灵魂穿越拯救弱者、只能在关键选择处干预——缺一不可，这是全篇互动叙事的规则地基。"
    - "本章无玩家选择点：不得在 lines 中写入任何 choice 指令，车祸与伊芙告知均为确定性剧情事件。"
    - "本章是「陆择作为陆择」的最后叙事，chapter 01 起他将以灵魂形态介入他人命运——陆择的现实人格在本章收束，不得提前透露试炼对象身份（陈默）。"
    - "顾盈的戏份严格限定在酒店客房一场：穿着陆择的白衬衫洗漱、夸赞昨晚技术、想加微信被拒——不得在其他场景出现或扩写其背景。"
    - "伊芙须保持引路人的可信与神秘：只揭示试炼规则，不剧透后续试炼的具体对象、地点或结局。"

scenes:
  - id: "s0_hotel"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "清晨_疏离"
      mode: "play"
      loop: true
    lines: []
    authoring:
      purpose: "建立陆择的现实生活状态——疏离、一夜情、逃避联结。让玩家体会「活着但不在场」的局促感，为后续死亡的震撼建立情感锚点。"
      beats:
        - "陆择在酒店客房醒来，宿醉头痛，环顾陌生而凌乱的客房。"
        - "注意到卫浴区入口的顾盈——她正穿着陆择的白衬衫洗漱，昨夜暧昧的物证散落一地。"
        - "顾盈主动搭话，夸赞陆择昨晚技术不错，气氛亲昵而表层。"
        - "顾盈提出想加陆择微信，试图把一夜关系延伸为持续联系。"
        - "陆择内心局促只想逃离，以「马上要离开这座城市」为由拒绝留下联系方式。"
        - "陆择匆忙穿衣离开酒店客房，把顾盈与这段表层联结一并甩在身后。"
      motif_anchors:
        - "凌乱的床铺与散落的衣物——一夜情的疏离物证，亲密的表层与空洞的内里。"
        - "顾盈穿的陆择白衬衫——借来的亲密，关系仅止于肌肤之亲的象征。"
        - "清晨冷白偏蓝的自然光——本章情绪基调的视觉锚定。"
      transition: "首场，无前接。从陆择的主观视角切入，建立「局促—逃离」的心理动机。"

  - id: "s1_road"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨幕_骤亡"
      mode: "play"
      loop: true
    lines: []
    authoring:
      purpose: "本章的情绪坠落点——把「日常」与「死亡」并置，让玩家感受死亡的骤然与不可控。逃离成功的短暂轻松被瞬间击碎。"
      beats:
        - "陆择离开酒店，走在雨幕笼罩的城市路口，湿滑路面反射着霓虹与车灯的冷光。"
        - "路边有打着伞等红灯的行人，城市生活照常运转的日常感。"
        - "陆择思绪仍停留在逃离的轻松与对下一座城市的模糊打算中。"
        - "陆择踏上斑马线过马路——毫无预兆地，车祸骤然降临。"
        - "当场身亡。不预告、不可逆、不可规避。"
      motif_anchors:
        - "雨幕与积水洼里的破碎倒影——生命的脆弱与破碎感。"
        - "红绿灯——不可逆的「停止」象征，命运的信号。"
        - "打着伞等红灯的行人——与陆择的死亡形成「照常生活」的残酷对照。"
      transition: "从酒店客房（冷蓝）切到雨幕路口（冷灰），同属冷色系但色温更阴沉；逃离成功的短暂轻松作为死亡骤临的情绪反差铺垫。可用 fade 衔接。"

  - id: "s2_seam"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "夹缝_光明"
      mode: "play"
      loop: true
    lines:
      - op: "jump"
        file: "chapter01_新皮肤"
    authoring:
      purpose: "本章的情绪反转点与机制锚点——从死亡的迷茫真空翻转到使命的赋予。建立伊芙的引路人身份，揭示贯穿全篇的试炼规则。"
      beats:
        - "陆择的意识在一片明亮虚空中苏醒——身体已死，灵魂滞留于过渡空间「灵魂夹缝」。"
        - "环境弥漫柔和白光与飘散的光粒，死亡的冰冷被治愈性的暖白取代。"
        - "伊芙以天使灵魂引路人的身份现身，语气平和而权威。"
        - "伊芙向陆择说明其现状：身体已死，灵魂尚未离去，有被赋予使命的资格。"
        - "伊芙揭示试炼规则的核心——六个试炼，每个持续 30 天，灵魂将穿越去拯救身处危难的弱者。"
        - "伊芙强调干预的限制：灵魂只能在关键选择处干预，不能任意改写他人命运。"
        - "陆择在震撼与疑惑中接受这个被赋予的使命，死亡的终结被重新定义为另一种开始的门票。"
        - "章节收束：陆择的灵魂即将启程前往第一次试炼——为 chapter 01 灵魂穿越至陈默做直接衔接。"
      motif_anchors:
        - "飘散的光粒——灵魂形态的视觉具象，轻盈与不确定性并存。"
        - "暖白倾泻的天光——死后「另一种开始」的救赎性隐喻，与雨幕路口的冷灰形成强反差。"
        - "六个试炼 / 30 天 / 关键选择——规则的机械锚点，后续互动叙事的地基。"
      transition: "从车祸雨幕（冷灰·死亡）切到灵魂夹缝（暖白·新生意义），是全章最强的色温反差与情绪反转；可用 fade to white 强化「死亡—觉醒」的跨越感。"
