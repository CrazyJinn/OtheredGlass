meta:
  chapter: 0
  title: "灵魂夹缝"
  requires:
    characters:
      - "陆择"
      - "伊芙"
    scenes:
      - "灵魂夹缝-夹缝空间"

scenes:
  - id: "夹缝"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "光隙"
      mode: "play"
      loop: true
    lines:
      - op: "jump"
        file: "chapter01_新皮肤"
    authoring:
      purpose: "揭示试炼机制（整部作品玩法的根基）+ 引出伊芙作为长期关系对象；为 chapter 01（陈默跳江/灵魂穿越）做直接衔接。终点情绪：明亮中的茫然 + 被赋予使命的微妙重量。"
      beats:
        - "陆择的灵魂在夹缝空间苏醒——着装已彻底脱离世俗，变为云雾蔽体（流动的白云环绕身体、自然遮挡重点部位，赤足）。"
        - "伊芙以天使灵魂引路人身份现身（月白薄纱天使裙、穿衣、神圣有序），与陆择的云雾蔽体形成'她穿衣 / 他云蔽'的对比——一个仍属秩序之内，一个已褪尽世俗。"
        - "伊芙平静地告知陆择他已经死了；陆择在明亮通透的治愈感与自身的茫然之间失重。"
        - "伊芙揭示试炼规则：六个试炼、每个30天、灵魂穿越去拯救弱者、且只能在关键选择处干预（机制揭示必须干净、无歧义）。"
        - "伊芙对自身动机、立场、信息来源留白——她不是工具人 NPC，是长期关系对象，玩家应产生好奇与微妙不信任。"
        - "伊芙宣告陆择的第一个试炼即将开始，画面淡出，无缝衔接 chapter 01。"
      motif_anchors:
        - "云雾蔽体（褪尽世俗的本真，世俗身份剥离隐喻弧的终点）"
        - "伊芙穿衣 vs 陆择云蔽（神圣有序 vs 灵魂本真的对照）"
        - "光粒与暖白光（治愈通透的'死后'稳态；与雨夜车祸的冷蓝形成冷暖反转）"
      transition: "jump file 跳转 chapter01_新皮肤，把玩家从伊芙宣告的瞬间无缝送入第一个试炼（陈默跳江 / 灵魂穿越）。"

authoring:
  direction: "灵魂夹缝——伊芙以引路人身份揭示试炼规则（六个/30天/灵魂穿越拯救弱者/仅关键选择可干预），为 chapter01 直接衔接。伊芙动机留白，玩家应生好奇与微妙不信任。"
  emotion_arc: "明亮中的茫然 + 被赋予使命的微妙重量（全章情感弧终点稳态）。"
  constraints:
    - "试炼规则揭示必须干净、无歧义：六个试炼、每个30天、灵魂穿越拯救弱者、只能在关键选择处干预。"
    - "伊芙的动机、立场、信息来源必须留白——她是长期关系对象，不是工具人 NPC。"
    - "伊芙（月白薄纱天使裙、穿衣、神圣有序）与陆择云雾蔽体（褪尽世俗、赤足）的「她穿衣 / 他云蔽」对比须自然呈现。"
    - "结尾用 jump file chapter01_新皮肤 直接衔接 chapter 01，不使用 ending。"
