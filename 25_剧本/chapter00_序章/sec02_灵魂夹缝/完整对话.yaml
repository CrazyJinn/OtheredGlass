meta:
  chapter: 0
  title: "灵魂夹缝"
  requires:
    characters:
      - "陆择"
      - "伊芙"
    scenes:
      - "灵魂夹缝-夹缝空间"
    portraits:
      - "陆择.茫然"
      - "陆择.沉吟"
      - "陆择.轻佻"
      - "伊芙.平静"
      - "伊芙.温柔"
      - "伊芙.庄严"
      - "伊芙.浅笑"

scenes:
  - id: "夹缝"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "光隙"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "亮。通透的、像泡在温水里的亮。"
      - op: "narrate"
        text: "陆择赤足站在一片没有边缘的白色空间里，腰间缠绕着流动的白云。"
      - op: "narrate"
        text: "衬衫、开衫、皮带——都不见了。云雾自然而然地遮住该遮的地方。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "……这是哪儿？"
      - op: "narrate"
        text: "远处有光粒在聚拢。一缕，又一缕，渐渐凝成少女的轮廓——月白薄纱，发梢泛着柔光。"
      - op: "narrate"
        text: "她赤足踩在云端，像本来就属于这片亮里。"
      - op: "show"
        who: "伊芙"
        portrait: "平静"
        pos: "right"
      - op: "say"
        who: "伊芙"
        portrait: "平静"
        pos: "right"
        text: "晨光的祝福，降临于你——阿门。"
      - op: "say"
        who: "伊芙"
        portrait: "平静"
        pos: "right"
        text: "嗯……让我想想，该怎么和你说。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "你是谁？"
      - op: "say"
        who: "伊芙"
        portrait: "平静"
        pos: "right"
        text: "我叫伊芙。你的灵魂引路人。"
      - op: "say"
        who: "伊芙"
        portrait: "温柔"
        pos: "right"
        text: "你，已经死了。"
      - op: "narrate"
        text: "她说得很轻，像在念一句早就准备好的祝词。"
      - op: "narrate"
        text: "陆择没有立刻反驳。他低头看了看自己被云雾遮蔽的身体，又看了看她那身整齐的薄纱。"
      - op: "say"
        who: "陆择"
        portrait: "沉吟"
        pos: "left"
        text: "……有点意思。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "审判的判词，已经落下了。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你活着那些日子，玩弄一颗又一颗的心，欠下的情债……够你去一个，很深的地方。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "……多深？"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "人们管那里，叫地狱。"
      - op: "say"
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "呵。"
      - op: "say"
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "那倒是新鲜。我这种人下去，估计能混个迎宾。"
      - op: "say"
        who: "伊芙"
        portrait: "温柔"
        pos: "right"
        text: "但——有人替你说了句话。"
      - op: "say"
        who: "伊芙"
        portrait: "温柔"
        pos: "right"
        text: "你有一样本事，一直用错了地方。你太懂人心……懂怎么让人动心，也懂一颗心碎起来，是什么声音。"
      - op: "say"
        who: "伊芙"
        portrait: "温柔"
        pos: "right"
        text: "所以，给你一条路。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "六个试炼，每个三十天。你的灵魂会穿越进一具身体，去救一个——在感情里，走投无路的人。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你只能在最关键的岔路口伸手。其余的，不许碰。"
      - op: "say"
        who: "伊芙"
        portrait: "温柔"
        pos: "right"
        text: "做成了，你的账，一笔勾销。"
      - op: "narrate"
        text: "陆择张了张嘴，那句惯用的玩笑，又溜到了嘴边。"
      - op: "narrate"
        text: "可“救一个在感情里走投无路的人”——这几个字像针，挑破了他那层逢迎的壳。被他随手丢掉的那些心，碎起来，原来是有声音的。"
      - op: "say"
        who: "陆择"
        portrait: "沉吟"
        pos: "left"
        text: "……是我这种人，弄碎的吧。"
      - op: "say"
        who: "陆择"
        portrait: "沉吟"
        pos: "left"
        text: "……为什么，是我。"
      - op: "say"
        who: "伊芙"
        portrait: "浅笑"
        pos: "right"
        text: "因为你欠的，是情债。"
      - op: "say"
        who: "伊芙"
        portrait: "浅笑"
        pos: "right"
        text: "能还的——也是情。"
      - op: "narrate"
        text: "她说这话时，目光轻轻偏向陆择身后的虚空，像在看一个不在场的人。"
      - op: "narrate"
        text: "那停顿很短，短得像错觉——但陆择看见了。他张了张嘴，终究没问。"
      - op: "say"
        who: "伊芙"
        portrait: "浅笑"
        pos: "right"
        text: "第一个试炼，要开始了。"
      - op: "say"
        who: "伊芙"
        portrait: "浅笑"
        pos: "right"
        text: "愿光，指引你的归途。"
      - op: "narrate"
        text: "亮光从四面八方涌过来，吞没云雾，吞没少女，也吞没他刚刚死去的那个雨夜。"
      - op: "ending"
        kind: "NE"
        title: "——序章 终——"
