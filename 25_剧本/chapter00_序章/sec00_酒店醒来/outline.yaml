  title: "酒店醒来"
  requires:
    characters:
      - "陆择"
      - "顾盈"
    scenes:
      - "酒店-客房"

authoring:
  direction: "陆择宿醉醒来，发现顾盈还在客房穿他的白衬衫洗漱。两人谁都没把一夜情当回事——调侃式互评昨晚、势均力敌地完成体面收场，门口临别收尾（问咖啡店被顾盈误判、用赶飞机打脸的落差）把洒脱推到顶。本节是序章情感弧起点（轻佻松弛 / 玩世不恭），建立陆择都市海王人设 + 顾盈势均力敌的女海王人设，并为 sec01 车祸硬翻转蓄满势能——把轻佻甜头推到满格，让下节死亡砸下来时反差最大化。本节为旧「疏离疲惫 / 借口逃离」方向的全量重做，beats / direction / emotion_arc / constraints 均以海王版覆盖。"
  emotion_arc: "起点：宿醉清晨的松弛暧昧，陆择半醒无尴尬、享受这种清晨（人设第一笔）→ 中段：调侃博弈升级，白衬衫视线交错 + 双关互评，势均力敌的暧昧推拉 → 顶点：门口问咖啡店的落差收尾，海王式洒脱满格（情绪在此硬停，车祸属 sec01）。情绪温度全程暧昧轻快、节奏明快，禁止压抑 / 疏离 / 尴尬逃避。"
  constraints:
    - "顾盈与陆择势均力敌——是被撩也能反撩的对手，不是被推开的示好方。台词必须双向博弈，禁止写成顾盈示好被推开。"
    - "R15 暧昧留白：前一夜的性是既成往事，本场不回闪、不写实质性行为描写。"
    - "禁用旧疏离版套路：不写「借口马上要离开这座城市」、不写「拒绝加微信 / 拒绝连接」、不写「疲惫 / 尴尬 / 逃避 / 局促 / 压抑」。"
    - "联系方式走反转：顾盈因昨晚技术不错主动提加微信，陆择以「太激烈、怕床受不了」调侃式拒绝（海王傲娇式拒绝，仍是调情，非疏离逃避），顾盈洒脱放手——不是旧版「借口离开的拒绝」，也不是谈钱谈交易。"
    - "收尾情绪必须为 sec01 车祸硬切蓄势——把轻佻松弛推到顶，反差最大化；车祸本身属 sec01，本节不写，末尾情绪推到顶即硬停。"
    - "白衬衫作为穿衣视线交错的视觉锚点；散落衣物暗示昨夜，禁止回闪。"
    - "BGM「晨离」覆盖全程，与暧昧松弛的情绪温度对齐。"

scenes:
  - id: "酒店"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
