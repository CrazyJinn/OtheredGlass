meta:
  chapter: 0
  title: "酒店醒来"
  requires:
    characters:
      - "陆择"
      - "顾盈"
    scenes:
      - "酒店-客房"

scenes:
  - id: "酒店"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "晨离"
      mode: "play"
      loop: true
    lines: []
    authoring:
      purpose: "建立陆择人设——拒绝连接的都市青年；让玩家在30秒内嗅到宿醉清晨的局促尴尬。情绪温度低、节奏慢，铺垫本章的轻疏离起点。"
      beats:
        - "陆择宿醉醒来，意识在陌生酒店客房里逐渐回归；窗外清晨冷白偏蓝的自然光透入。"
        - "浴室方向传来水声——顾盈正穿着陆择的白衬衫洗漱（白衬衫被她一夜穿走，这是陆择此刻赤裸上身的合理化因果）。"
        - "顾盈从浴室出来，带着轻佻与熟稔评价昨夜，掏出手机想加陆择微信（一次连接的尝试）。"
        - "陆择以'我马上要离开这座城市'为借口把这一夜定性为不需要后续的偶然，温和地推开加微信（拒绝连接的本能）。"
        - "陆择匆忙收拾离开客房，把顾盈留在身后；节奏保持慢、压抑，情绪不升温。"
      motif_anchors:
        - "白衬衫（被顾盈穿走——昨夜的连接被对方占据，陆择失去遮蔽）"
        - "赤裸上身（陆择的脆弱与欲念状态，世俗身份的第一层剥离）"
      transition: "陆择穿上商务休闲套装的剩余部分（燕麦卡其开衫、深灰长裤、皮带、皮鞋；开衫内无衬衫，因白衬衫已被顾盈穿走）离开酒店。情绪由尴尬逃避转入逃离途中的麻木行走，画面衔接阴雨天的城市路口。"

authoring:
  direction: "酒店清晨——陆择宿醉醒来，以「离开这座城市」为借口推开顾盈加微信的连接尝试，建立「拒绝连接」人设。节奏慢、情绪温度低，铺垫全章轻疏离起点。"
  emotion_arc: "轻疏离 / 尴尬逃避（全章情感弧起点）。"
  constraints:
    - "白衬衫被顾盈穿走——昨夜连接被对方占据、陆择失去遮蔽的因果，须自然交代。"
    - "陆择的台词折射对「连接」的回避（借口离开、婉拒加微信）。"
