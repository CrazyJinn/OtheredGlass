    lines: []
    authoring:
      purpose: "建立陆择「都市海王」人设（玩世不恭、轻车熟路、把一夜情当稀松平常）+ 顾盈「势均力敌的女海王」人设（被撩也能反撩，不是示好方），同时为 sec01 车祸前的情绪蓄势——把暧昧松弛的甜头推到满格，让下节死亡砸下来时反差最大化。"
      beats:
        - "开场：陆择半醒宿醉，意识到身侧有人——毫无尴尬，反而松弛地享受这种清晨（人设第一笔：把一夜情当稀松平常事，与旧版「疲惫尴尬」正面冲突，须明确覆盖）。"
        - "顾盈穿着陆择的白衬衫在卫浴区整理，衬衫松垮半敞——她不遮掩，大大方方让陆择看（穿衣视线交错即调情；白衬衫意象登场，作为本场视觉焦点）。"
        - "调侃式双关互评：顾盈先发制人夸陆择「昨晚技术 / 身手不错」，陆择轻佻回敬（互评专业度，海王式博弈——是势均力敌的对手，不是示好 vs 推开）。"
        - "联系方式反转：顾盈因欣赏昨晚技术主动提加微信，陆择以「太激烈、怕床受不了」调侃式拒绝（海王傲娇，仍是调情，非旧版疏离借口），顾盈洒脱放手互不留恋——全段不约下次、不留联系方式。"
        - "门口临别收尾：陆择问附近咖啡店，顾盈误以为要请她喝、被陆择以「等下赶飞机、昨晚酒喝多了要清醒一下」打脸（海王式落差——他只是为自己，不是为她）；顾盈俏皮假抱怨后洒脱放行。不约下次、不留联系方式。陆择满脑子咖啡店与登机时间的日常盘算，把「毫无死亡预兆的洒脱」推到顶，随即硬停为 sec01 车祸蓄满势能。"
        - "陆择踏出客房门——情绪在此硬停（不写车祸，车祸属 sec01；本节末尾情绪推到顶即结束，为下节死亡硬翻转铺满势能）。"
      motif_anchors:
        - "白衬衫（顾盈穿陆择的衬衫——视觉焦点 + 共享私密物件，替代旧版「凌乱床铺」的疏离尴尬意象）。"
        - "散落的衣物（凌乱床铺暗示昨夜，无需回闪——既成往事的视觉提示）。"
        - "客房门口（临别收尾的舞台 + 与 sec01 雨天马路的硬切分界）。"
      transition: "客房门关上 → sec01「意外突生」雨天马路硬切（情绪温度从海王式洒脱的日常盘算骤降到死亡的虚无断点，全章唯一硬翻转）。本节末尾无需 jump / ending——节级文件自然结束，publisher 合并后顺序进入 sec01 预分配 scene id「路口」。"
