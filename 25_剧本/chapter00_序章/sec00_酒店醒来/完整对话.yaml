meta:
  chapter: 0
  title: "酒店醒来"
  requires:
    characters:
      - "陆择"
      - "顾盈"
    scenes:
      - "酒店-客房"
    portraits:
      - "陆择.客套笑"
      - "陆择.婉拒"
      - "顾盈.慵懒"
      - "顾盈.玩味"
      - "顾盈.挑眉"

scenes:
  - id: "酒店"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "晨离"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "冷白偏蓝的晨光，陌生天花板。"
      - op: "narrate"
        text: "床单的气味不属于自己家。陆择赤裸上身坐起来，揉了揉太阳穴——白衬衫不见了。"
      - op: "narrate"
        text: "浴室门缝漏出暖黄一线，水声还在响。"
      - op: "narrate"
        text: "门开了。顾盈穿着他的白衬衫出来，头发湿着，袖口卷到小臂，衣摆堪堪遮到大腿根。"
      - op: "show"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "嗯……醒啦。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "昨晚，挺尽兴的。"
      - op: "narrate"
        text: "她倚在浴室门框上，指尖还滴着水。"
      - op: "say"
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "加个微信呗，下次方便。"
      - op: "say"
        who: "陆择"
        portrait: "客套笑"
        pos: "left"
        text: "呵。"
      - op: "say"
        who: "陆择"
        portrait: "客套笑"
        pos: "left"
        text: "这个嘛……我马上要离开这座城市。"
      - op: "say"
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "嗯？是吗。"
      - op: "narrate"
        text: "她笑了一下，没再坚持。"
      - op: "say"
        who: "陆择"
        portrait: "婉拒"
        pos: "left"
        text: "昨夜，多谢款待。"
      - op: "narrate"
        text: "陆择抓起地上的卡其开衫、深灰长裤，匆忙套上。衬衫没找——白衬衫穿在她身上。"
      - op: "narrate"
        text: "皮带金属扣在清晨的安静里响得突兀。"
      - op: "say"
        who: "陆择"
        portrait: "婉拒"
        pos: "left"
        text: "我先走了。"
      - op: "hide"
        who: "顾盈"
      - op: "narrate"
        text: "门合上，把那个声音和那间客房都关在了身后。"
