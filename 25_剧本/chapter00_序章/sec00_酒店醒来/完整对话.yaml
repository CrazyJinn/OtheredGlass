meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
    scenes:
      - "酒店-客房"
    portraits:
      - "陆择.慵懒"
      - "陆择.玩味"
      - "陆择.轻佻"
      - "顾盈.慵懒"
      - "顾盈.玩味"
      - "顾盈.挑眉"
scenes:
  - id: "酒店"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "晨离"
      mode: "play"
      loop: true
    lines:
      # 拍 1 · 半醒宿醉：散落衣物暗示昨夜 + 陆择松弛无尴尬 + 无防备少年气（死亡锚点）
      - op: "narrate"
        text: "清晨的光从窗帘缝里漏进来。床脚倒着一只高跟鞋，椅背上搭着件男士外套。"
      - op: "narrate"
        text: "陆择翻了个身，顺手把被子往空了的另一半拢了拢。被子里还留着别人的体温。"
      - op: "say"
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
        text: "……几点了。"
      - op: "narrate"
        text: "他没急着睁眼，又把脸埋进枕头。"
      # 拍 2 · 白衬衫视线交错：顾盈大大方方让看 + 反手点评把“被看”翻成审视，陆择轻佻接招
      - op: "narrate"
        text: "卫浴区传来水声。陆择撑起身循声望去，顾盈背对着他站在镜前，套着他的白衬衫，下摆堪堪盖过大腿，正拢着头发。"
      - op: "show"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
      - op: "say"
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "哟，醒了。"
      - op: "narrate"
        text: "她从镜子里瞥他一眼，没去拢敞着的领口。"
      - op: "say"
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "这衬衫，我穿可比你顺眼。"
      - op: "say"
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "呵，那是。我穿它的时候，没人盯着衬衫看。"
      # 拍 3 · 双关互评：顾盈先发挑逗，陆择金句“怕床受不了”扣杀主导
      - op: "say"
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "嗯……昨晚，挺卖力的。"
      - op: "narrate"
        text: "陆择抬手敲了敲床头板。"
      - op: "say"
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "没办法。主要是这床不行——再来几次，怕是要塌。"
      # 拍 4 · 联系方式反转：陆择自作多情先发拒不存在的请求，顾盈精准收束扣杀，陆择嘴硬遮掩
      - op: "narrate"
        text: "陆择下床去寻裤子。"
      - op: "say"
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "对了，留号码这种事，咱们就免了吧？"
      - op: "narrate"
        text: "顾盈扣上最上面那颗扣子，回过头。"
      - op: "say"
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "放心。没打算加你。"
      - op: "say"
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "呵，我倒松了口气。"
      # 拍 5 · 门口咖啡店误会：陆择问咖啡店，顾盈误判被“赶飞机”打脸，俏皮假抱怨后洒脱放行
      - op: "narrate"
        text: "两人收拾停当，到了门口。"
      - op: "say"
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "这附近哪儿有咖啡店？"
      - op: "say"
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "嗯？请我？"
      - op: "say"
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "想多了，我赶飞机。昨晚喝成那样，得找杯咖啡缓缓。"
      - op: "say"
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "啧，白高兴。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "行吧，飞你的吧。"
      - op: "narrate"
        text: "她拉开门，让出半边身位。"
      # 拍 6 · 出门来得及：金句收口，表层从容实为全章最大反讽，门关硬停（车祸属 sec01）
      - op: "narrate"
        text: "陆择迈出门槛。"
      - op: "say"
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
        text: "还有俩小时，来得及。"
      - op: "narrate"
        text: "门在身后合上。"
