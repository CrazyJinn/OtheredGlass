meta:
  chapter: 0
  title: "酒店醒来"
  requires:
    characters:
      - "陆择"
      - "顾盈"
    scenes:
      - "酒店-客房"
    portraits:
      - "陆择.慵懒"
      - "陆择.玩味"
      - "陆择.轻佻"
      - "顾盈.慵懒"
      - "顾盈.挑眉"
      - "顾盈.玩味"

scenes:
  - id: "酒店"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "晨离"
      mode: "play"
      loop: true
    lines:
      - op: narrate
        text: "清晨。阳光从窗帘缝隙斜斜地落在凌乱的床铺上。"
      - op: narrate
        text: "床头柜上倒着一只空酒瓶。地毯上散落着衣物——一条连衣裙，一件白衬衫。"
      - op: narrate
        text: "陆择半靠在床头，揉了揉额角。"
      - op: show
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
      - op: say
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
        text: "呵。"
      - op: say
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
        text: "……有点过头了。"
      - op: narrate
        text: "卫浴间里传来水声。"
      - op: narrate
        text: "片刻，门开了。"
      - op: narrate
        text: "顾盈走出来，身上套着他的白衬衫，下摆松松地盖到大腿，前襟敞着两颗扣子。"
      - op: show
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
      - op: say
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "……哟。"
      - op: say
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "醒得挺早啊。"
      - op: say
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "衬衫穿得挺顺手。"
      - op: say
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "嗯?"
      - op: say
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "你的衬衫比我的裙子舒服。"
      - op: say
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "总不能空着身子走出酒店吧。"
      - op: say
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "那倒也是。"
      - op: say
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "穿着挺好看。"
      - op: say
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "昨晚……挺能折腾的啊。"
      - op: say
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "您过奖。"
      - op: say
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "也是您配合得好。"
      - op: say
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "嗯?"
      - op: say
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "嘴这么甜。"
      - op: say
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "难怪昨晚那么会哄人。"
      - op: say
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "那也是实话实说。"
      - op: say
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "留个微信呗。"
      - op: say
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "下次方便。"
      - op: narrate
        text: "陆择看了她一眼，没动手机。"
      - op: say
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "加微信干嘛。"
      - op: say
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "昨晚那么激烈，再约我怕这床先散架。"
      - op: say
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "啧。"
      - op: say
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "那可惜了。"
      - op: narrate
        text: "陆择套上裤子，顾盈换回裙子时把白衬衫丢还给他。"
      - op: say
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "附近有好喝的咖啡店吗?"
      - op: say
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "怎么?"
      - op: say
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "还要请我喝杯咖啡?"
      - op: say
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "等下赶飞机。"
      - op: say
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "昨晚酒喝多了，找杯咖啡清醒一下。"
      - op: say
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "啧。"
      - op: say
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "那你自己找去吧。"
      - op: say
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "走了。你慢慢收拾。"
      - op: hide
        who: "顾盈"
      - op: hide
        who: "陆择"
      - op: narrate
        text: "门在身后轻轻合上。"
      - op: narrate
        text: "陆择往电梯方向走去，盘算着先顺路找家咖啡店。"
