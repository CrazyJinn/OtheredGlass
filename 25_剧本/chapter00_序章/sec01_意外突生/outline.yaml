meta:
  chapter: 0
  title: "意外突生"
  requires:
    characters:
      - "陆择"
      - "小夏"
    scenes:
      - "街角咖啡店-点餐台"
      - "马路-路口"

scenes:
  - id: "咖啡店"
    scene: "街角咖啡店-点餐台"
    time: "清晨"
    bgm:
      track: "晨咖"
      mode: "play"
      loop: true
    lines: []
    authoring:
      purpose: "陆择进街角咖啡店买咖啡清醒，延续海王轻佻——随口撩店员小姑娘几句，小姑娘脸红。这是车祸前「最后的日常暖意」：越松弛、越世俗，下段雨街死亡砸下来时反差越冷。小夏为龙套，全程用 narrate 描写脸红反应，不 say、不 show 立绘。"
      beats:
        - "陆择推开咖啡店的门，清晨小店暖黄灯光、咖啡机蒸汽——与即将到来的雨街冷色形成最后一层暖色铺垫。"
        - "点餐台后是扎马尾的年轻女店员小夏；陆择点美式，宿醉未醒、懒懒地。"
        - "陆择随口撩两句（早班眼睛亮 / 夸你别紧张），温和讨喜式的轻佻——是海王让人脸红的「会撩」，不是猥琐。"
        - "小夏耳根红、递咖啡时手抖碰了一下又缩回——全程 narrate 描写反应，不 say、不 show 立绘。"
        - "陆择接过咖啡，笑了笑，转身推门出去——把暖意留在身后，门一开就是雨。"
      motif_anchors:
        - "咖啡（陆择要清醒赶飞机的现实盘算，承接 sec00 末「找杯咖啡清醒一下」）。"
        - "小夏的脸红（海王魅力的最后一笔，与下段死亡的虚无形成「生的温度」反衬）。"
        - "暖黄灯光（与下段雨街冷光硬切的色温分界）。"
      transition: "推门出去 → 路口雨天硬切：暖黄灯光瞬间被雨幕冷光替换，情绪从轻佻暖意骤降到湿冷烦躁。"

  - id: "路口"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨路"
      mode: "play"
      loop: true
    lines: []
    authoring:
      purpose: "全章唯一情绪硬翻转（turning point）——车祸必须快而硬。从「出门遇雨没伞」的日常烦躁，到「看到机场巴士→冲街口赶飞机」的急切，落到死亡虚无断点。车祸是陆择主动行为（急冲闯马路）的代价，呼应赶飞机，比单纯天灾更扎人。"
      beats:
        - "门一推开雨泼下来，陆择没带伞，缩在门檐下举咖啡杯挡雨。"
        - "自言自语抱怨「真讨厌下雨天」（说出口的烦躁）。"
        - "看到马路对面机场巴士亮着灯停站台——赶飞机的执念登场（车祸伏笔）。"
        - "内心独白：跑过去还来得及（心理活动，用 narrate，不渲染软化）。"
        - "攥紧咖啡杯，一头扎进雨里冲过街口。"
        - "雨幕里冲出来的一样东西——撞击声。然后什么都没有了（车祸两三句内落定，快而硬，禁止蒙太奇 / 慢镜头 / 内心独白软化）。"
        - "画面黑场（雨声白噪），作为硬翻转的视听锚点。"
      motif_anchors:
        - "雨（洗刷 / 净化的过渡意象，承接灵魂夹缝的「明亮通透」）。"
        - "机场巴士的灯光（赶飞机执念的最后一眼，生之欲望的最后一个落点）。"
        - "撞击 + 黑场（全章唯一硬翻转的视听锚点）。"
      transition: "黑场 → sec02「灵魂夹缝」明亮通透空间：灵魂从躯体剥离，画面从雨夜黑场转入明亮治愈的夹缝，陆择着装同步从商务休闲蜕变为云雾蔽体，完成世俗身份剥离隐喻弧的最后一跳。"

authoring:
  direction: "sec01 从咖啡店暖意到雨街死亡的两段滑坡，落点是全章唯一硬翻转——车祸。前段（咖啡店）延续 sec00 海王轻佻、节奏明快，建立「最后的日常暖意」；后段（路口）遇雨没伞 → 冲街口赶机场巴士 → 被撞，从日常烦躁急切骤降到死亡虚无。车祸必须猝然、快而硬，两三句内落定。"
  emotion_arc: "轻佻暖意（咖啡店撩拨，延续 sec00 海王调性）→ 烦躁（出门遇雨没伞）→ 急切（看到机场巴士、冲街口赶飞机）→ 猝然虚无（车祸硬翻转，全章谷底）。两段 scene 之间是一次暖→冷的色温硬切，节末黑场是全章唯一硬翻转的视听锚点。"
  constraints:
    - "车祸必须猝然、快而硬——不能用蒙太奇、慢镜头或内心独白软化；死亡在两三句内落定（沿用原 sec01 的硬切写法）。"
    - "咖啡店段的撩拨延续海王人设，但服务于「车祸前的最后暖意」蓄势，不喧宾夺主；陆择声音支柱（温和讨喜 + 玩世不恭 + 反问玩笑）保持一致。"
    - "小夏是龙套：用 narrate 描写脸红反应，不 say、不 show 立绘，避免立绘出图成本。"
    - "车祸是陆择主动行为（没带伞急于赶飞机、冲街口闯马路）的代价，不是单纯「雨天路滑」——呼应 sec00 末「找杯咖啡清醒一下、等下赶飞机」的盘算。"
    - "陆择穿商务休闲装（开衫内无衬衫，白衬衫被顾盈穿走），身份已是空壳的暗示（承接 sec00）。"
    - "节末黑场自然结束，无 jump / ending——publisher 合并后顺序进入 sec02 预分配 scene id「夹缝」。"
