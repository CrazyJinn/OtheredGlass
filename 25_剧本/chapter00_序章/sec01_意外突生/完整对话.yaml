meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "小夏"
    scenes:
      - "街角咖啡店-点餐台"
      - "马路-路口"
    portraits:
      - "陆择.慵懒"
      - "陆择.玩味"
      - "陆择.轻佻"
scenes:
  - id: "咖啡店"
    scene: "街角咖啡店-点餐台"
    time: "清晨"
    bgm:
      track: "晨咖"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "门铃叮一声。店里暖黄的，咖啡机嘶嘶冒着白汽。"
      - op: "narrate"
        text: "点餐台后站着个扎马尾的女孩，正低头擦杯子。"
      - op: "show"
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
      - op: "say"
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
        text: "一杯美式，谢了。"
      - op: "narrate"
        text: "她抬头瞟了他一眼，转身去接咖啡。"
      - op: "say"
        who: "陆择"
        portrait: "轻佻"
        pos: "left"
        text: "呵，早班啊。眼睛倒挺亮。"
      - op: "narrate"
        text: "她端着杯子回来，耳根红着，放到台上时指尖擦过他的手背，又飞快缩回去。"
      - op: "say"
        who: "陆择"
        portrait: "玩味"
        pos: "left"
        text: "逗你的，别紧张。"
      - op: "narrate"
        text: "陆择接过咖啡，笑了笑，转身推门出去。"
      - op: "hide"
        who: "陆择"
  - id: "路口"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨路"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "门一推开，雨就泼了下来。陆择没带伞，缩在门檐下，举着咖啡杯挡了挡。"
      - op: "show"
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
      - op: "say"
        who: "陆择"
        portrait: "慵懒"
        pos: "left"
        text: "呵，这雨，真讨厌。"
      - op: "narrate"
        text: "对面站台边，一辆机场巴士亮着灯。他看了眼手机，端着咖啡朝对面踱过去。"
      - op: "narrate"
        text: "雨幕里冲出一道灯光。一声闷响。"
      - op: "hide"
        who: "陆择"
      - op: "narrate"
        text: "然后，什么都没有了。"
      - op: "narrate"
        text: "画面黑下去。只剩雨声，慢慢也淡了。"
