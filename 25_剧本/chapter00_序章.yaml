meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
    scenes:
      - "酒店-客房"
      - "马路-路口"
    portraits:
      - "陆择.宿醉"
      - "陆择.轻松"
      - "陆择.走神"
      - "顾盈.慵懒"
scenes:
  - id: "宿醉醒来"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "宿醉清晨"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "窗帘缝里漏进一道清晨的冷白光。"
      - op: "narrate"
        text: "浴室里传来水声。床头柜上，两只空酒杯并排搁着。"
      - op: "narrate"
        text: "陆择睁开眼，盯着天花板，太阳穴还在突突地跳。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "醒了？挺能睡啊。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "呵……有点累。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "是吗。"
      - op: "narrate"
        text: "她擦着头发走出来，白衬衫松松垮垮地搭在身上——那是陆择昨夜随手脱下的那件。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "昨晚你倒是挺来劲的，嗯？"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "这个嘛……喝多了，难免。"
      - op: "narrate"
        text: "陆择摸了摸床头柜。手机不在。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "我手机呢？"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "桌上。没电了，自己关了。"
      - op: "narrate"
        text: "他伸手够到那块黑屏，指节顿了一下。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "哎，真没电了——"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "我得先走一步，公司那边催得急。回头，啊，咖啡我请。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "嗯？这么急。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "项目上的烂事，没办法。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "行吧。白衬衫我先穿着了。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "随意。"
      - op: "hide"
        who: "顾盈"
      - op: "narrate"
        text: "陆择抓起外套，连头也没回，推开了门。"
      - op: "hide"
        who: "陆择"
      - op: "bgm"
        track: "宿醉清晨"
        mode: "fade"
      - op: "jump"
        scene: "车祸瞬间"
  - id: "车祸瞬间"
    scene: "马路-路口"
    time: "白天"
    bgm:
      track: "喧嚣街头"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "酒店门口的风是凉的。"
      - op: "narrate"
        text: "陆择把外套领子拢了拢，长长吐出一口气。"
      - op: "say"
        who: "陆择"
        portrait: "轻松"
        pos: "center"
        text: "呵……又是这一套。"
      - op: "narrate"
        text: "对面的早餐店正冒着热气。红绿灯在头顶切换。斑马线上的人来来去去，谁也没多看谁一眼。"
      - op: "narrate"
        text: "他按了按手机。屏幕没亮。"
      - op: "narrate"
        text: "随手塞回口袋。"
      - op: "show"
        who: "陆择"
        portrait: "走神"
        pos: "center"
      - op: "narrate"
        text: "绿灯亮了。他随着人流迈下路缘石。"
      - op: "bgm"
        track: "喧嚣街头"
        mode: "fade"
      - op: "sfx"
        track: "急刹"
      - op: "sfx"
        track: "闷响"
      - op: "hide"
        who: "陆择"
      - op: "narrate"
        text: "——"
      - op: "narrate"
        text: "之后的事情，陆择没有看见。"
