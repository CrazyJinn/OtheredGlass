meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
      - "伊芙"
    scenes:
      - "酒店-客房"
      - "马路-路口"
      - "灵魂夹缝-夹缝空间"
    portraits:
      - "陆择.宿醉"
      - "陆择.轻松"
      - "陆择.走神"
      - "顾盈.慵懒"
      - "伊芙.庄严"

scenes:
  - id: "s0_hotel"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "清晨_疏离"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "清晨的酒店客房，冷白偏蓝的光从窗帘缝隙渗进来。"
      - op: "narrate"
        text: "床铺凌乱，昨夜的物证散落一地。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "center"
        text: "……"
      - op: "narrate"
        text: "陆择按着太阳穴坐起身，宿醉的钝痛在颅骨里跳了一下。"
      - op: "narrate"
        text: "卫浴间的水流声停了。镜前站着一个穿着他白衬衫的女人。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "醒啦？"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "昨晚挺有意思的嘛，不像第一次见面的样子。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "呵，有意思。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "加个微信？"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "下回方便再约嘛。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "这个嘛……让我想想。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "不太巧，我马上要离开这座城市。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "嗯？"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "那就走之前先存个号呗。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "下次吧，不急的。"
      - op: "narrate"
        text: "陆择抓起地上的衣物迅速套上，动作没有犹豫。"
      - op: "say"
        who: "陆择"
        portrait: "轻松"
        pos: "left"
        text: "你看你，又跟我客气了。下次有机会再聊，啊？"
      - op: "narrate"
        text: "门咔哒一声合上。他把顾盈与这段表层联结一并甩在身后。"

  - id: "s1_road"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨幕_骤亡"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "雨幕笼罩的十字路口，霓虹在水洼里碎成光斑。"
      - op: "narrate"
        text: "路边几个行人撑着伞，安静地等红灯。"
      - op: "say"
        who: "陆择"
        portrait: "轻松"
        pos: "center"
        text: "呵，下一座城市。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "center"
        text: "有意思……下一站去哪儿呢。"
      - op: "narrate"
        text: "绿灯亮起。他踏上斑马线。"
      - op: "narrate"
        text: "一道刺目白光。"
      - op: "narrate"
        text: "然后——什么都没有了。"

  - id: "s2_seam"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "夹缝_光明"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "一片明亮的虚空，飘散的光粒像柔软的雪。"
      - op: "narrate"
        text: "陆择的意识在光里慢慢浮起。身体不在了，但思考还在。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "……这是哪儿？"
      - op: "show"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "晨光的祝福降临于你，迷途的孩子。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "呵，有意思。你是谁？"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "那个……让我想想，按人间的说法——"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "我叫伊芙。天使灵魂引路人，唔，大概是这样。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "天使。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "你的身体已经死了。但灵魂尚未离去。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "愿光指引你的归途——你被赋予了一次机会。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "什么机会？"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "六个试炼。每个持续三十天。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "你的灵魂将穿越至身处危难的弱者身畔，去拯救他们。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "但你只能在关键选择处干预，不能任意改写他人的命运。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "——阿门。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "听起来，挺有意思。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "center"
        text: "那么，愿光与你同去。"
      - op: "narrate"
        text: "光粒收拢，新的世界在陆择脚下缓缓展开。"
      - op: "jump"
        file: "chapter01_新皮肤"
