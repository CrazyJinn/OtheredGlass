meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
      - "伊芙"
    scenes:
      - "酒店-客房"
      - "马路-路口"
      - "灵魂夹缝-夹缝空间"
    portraits:
      - "陆择.宿醉"
      - "陆择.轻松"
      - "陆择.走神"
      - "顾盈.慵懒"
      - "伊芙.庄严"

scenes:
  - id: "酒店醒来"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "清晨宿醉"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "头痛。眼皮沉得像灌了铅。冷白的晨光透过窗帘缝切进来。"
      - op: "narrate"
        text: "满屋子暖气与昨夜残留的酒味——身边没人。"
      - op: "narrate"
        text: "卫浴区传来水声，玻璃门后一个模糊的身影。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "醒啦。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "昨晚挺猛的嘛。"
      - op: "say"
        who: "陆择"
        portrait: "宿醉"
        pos: "left"
        text: "...早。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "嗯?就这么句话?"
      - op: "narrate"
        text: "她从卫浴区出来，白衬衫下摆盖到大腿，伸手翻他的外套——手机。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "扫一下呗。微信。"
      - op: "say"
        who: "陆择"
        portrait: "轻松"
        pos: "left"
        text: "呵，这个嘛......"
      - op: "say"
        who: "陆择"
        portrait: "轻松"
        pos: "left"
        text: "我跟你说个事儿——我一会儿就走，今天奔下一座城。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "嗯?出差?"
      - op: "say"
        who: "陆择"
        portrait: "轻松"
        pos: "left"
        text: "差不多。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "......是吗。"
      - op: "narrate"
        text: "她没追问。手机放回原位，转身回卫浴区。"
      - op: "narrate"
        text: "水声又响起来。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "那你慢慢收拾——"
      - op: "narrate"
        text: "陆择利落穿衣。鞋，门卡，外套。回头看了一眼。"
      - op: "narrate"
        text: "水声没停。她没回头。"
      - op: "narrate"
        text: "一瞬有点什么东西涌上来——他把它压下去，关门。"
      - op: "jump"
        scene: "车祸身亡"

  - id: "车祸身亡"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨街"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "雨幕。湿沥青反着霓虹的冷光，像碎掉的镜子。"
      - op: "narrate"
        text: "酒店门一推，冷风裹着雨水扑面。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "center"
        text: "......走吧。"
      - op: "narrate"
        text: "红绿灯。斑马线。人群打着伞往前挪。"
      - op: "narrate"
        text: "陆择没打伞。脑子里还是那句'是吗'——顾盈的尾音。"
      - op: "narrate"
        text: "绿灯亮了。他迈步。"
      - op: "narrate"
        text: "刹车声。"
      - op: "narrate"
        text: "然后什么都没了。"
      - op: "jump"
        scene: "夹缝相遇"

  - id: "夹缝相遇"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "光隙"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "光。从四面八方渗进来的、温热的光。"
      - op: "narrate"
        text: "没有雨，没有路口，没有身体。陆择想抬手——没有手。"
      - op: "narrate"
        text: "然后他发现自己站着。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "......这是哪儿？"
      - op: "narrate"
        text: "一道光雾在前方聚拢。一个轮廓从光里走出来——羽翼、长袍、温和得不像话的眼神。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "愿光指引你的归途，迷途的孩子——阿门。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "......天使？"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "有意思。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "那个......不是 cos 呢。让我想想怎么解释......"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你......已经不在这个世界上了。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "......"
      - op: "narrate"
        text: "顾盈的尾音一瞬又回来了。这次压不下去。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "那......这是哪？我......死了？"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "这里是灵魂夹缝——彼岸的前厅，光之祝福停留之处。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "我是伊芙。为你引路的人。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你要完成六个试炼。每个三十天。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "......试炼？"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你会穿越进一个灵魂濒临熄灭的人——三十天内，只能在他的关键选择处干预。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "拯救他，光之祝福会降临于你。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "......拯救。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "为什么是我？"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "那个......这个问题，经文里好像有答案......"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "但我记错章节了——愿光......愿光指引我下次想起来。阿门。"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "......"
      - op: "say"
        who: "陆择"
        portrait: "走神"
        pos: "left"
        text: "那......要是救不了呢？"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "......"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "那个......这个......我也记错了。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "不过你放心，第一个灵魂......已经为你准备好了。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "他叫......让我想想......陈默。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "今天，他会跳进江里。你会进入他。"
      - op: "narrate"
        text: "光粒在陆择身边飘散。他没来得及再问。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "愿光指引你的第一段归途——阿门。"
      - op: "narrate"
        text: "光从四周合拢。雨声先回来了。"
