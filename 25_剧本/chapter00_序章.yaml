meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
      - "伊芙"
    scenes:
      - "酒店-客房"
      - "马路-路口"
      - "灵魂夹缝-夹缝空间"
    portraits:
      - "陆择.客套笑"
      - "陆择.婉拒"
      - "陆择.茫然"
      - "陆择.沉吟"
      - "顾盈.慵懒"
      - "顾盈.玩味"
      - "顾盈.挑眉"
      - "伊芙.平静"
      - "伊芙.温柔"
      - "伊芙.庄严"
      - "伊芙.浅笑"

scenes:
  - id: "酒店"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "晨离"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "冷白偏蓝的晨光，陌生天花板。"
      - op: "narrate"
        text: "床单的气味不属于自己家。陆择赤裸上身坐起来，揉了揉太阳穴——白衬衫不见了。"
      - op: "narrate"
        text: "浴室门缝漏出暖黄一线，水声还在响。"
      - op: "narrate"
        text: "门开了。顾盈穿着他的白衬衫出来，头发湿着，袖口卷到小臂，衣摆堪堪遮到大腿根。"
      - op: "show"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "嗯……醒啦。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "昨晚，挺尽兴的。"
      - op: "narrate"
        text: "她倚在浴室门框上，指尖还滴着水。"
      - op: "say"
        who: "顾盈"
        portrait: "玩味"
        pos: "right"
        text: "加个微信呗，下次方便。"
      - op: "say"
        who: "陆择"
        portrait: "客套笑"
        pos: "left"
        text: "呵。"
      - op: "say"
        who: "陆择"
        portrait: "客套笑"
        pos: "left"
        text: "这个嘛……我马上要离开这座城市。"
      - op: "say"
        who: "顾盈"
        portrait: "挑眉"
        pos: "right"
        text: "嗯？是吗。"
      - op: "narrate"
        text: "她笑了一下，没再坚持。"
      - op: "say"
        who: "陆择"
        portrait: "婉拒"
        pos: "left"
        text: "昨夜，多谢款待。"
      - op: "narrate"
        text: "陆择抓起地上的卡其开衫、深灰长裤，匆忙套上。衬衫没找——白衬衫穿在她身上。"
      - op: "narrate"
        text: "皮带金属扣在清晨的安静里响得突兀。"
      - op: "say"
        who: "陆择"
        portrait: "婉拒"
        pos: "left"
        text: "我先走了。"
      - op: "hide"
        who: "顾盈"
      - op: "narrate"
        text: "门合上，把那个声音和那间客房都关在了身后。"

  - id: "路口"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨路"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "阴雨。湿滑的路口，霓虹和车灯在积水洼里晕成冷光。"
      - op: "narrate"
        text: "红灯倒数。陆择撑着伞站在斑马线一侧。"
      - op: "narrate"
        text: "绿灯。人流涌出去。"
      - op: "narrate"
        text: "雨幕里冲出来的一样东西——"
      - op: "narrate"
        text: "撞击声。然后什么都没有了。"

  - id: "夹缝"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "光隙"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "亮。通透的、像泡在温水里的亮。"
      - op: "narrate"
        text: "陆择赤足站在一片没有边缘的白色空间里，腰间缠绕着流动的白云。"
      - op: "narrate"
        text: "衬衫、开衫、皮带——都不见了。云雾自然而然地遮住该遮的地方。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "……这是哪儿？"
      - op: "narrate"
        text: "远处有光粒在聚拢。一缕，又一缕，渐渐凝成少女的轮廓——月白薄纱，发梢泛着柔光。"
      - op: "narrate"
        text: "她赤足踩在云端，像本来就属于这片亮里。"
      - op: "show"
        who: "伊芙"
        portrait: "平静"
        pos: "right"
      - op: "say"
        who: "伊芙"
        portrait: "平静"
        pos: "right"
        text: "晨光的祝福，降临于你——阿门。"
      - op: "say"
        who: "伊芙"
        portrait: "平静"
        pos: "right"
        text: "嗯……让我想想，该怎么和你说。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "你是谁？"
      - op: "say"
        who: "伊芙"
        portrait: "平静"
        pos: "right"
        text: "我叫伊芙。你的灵魂引路人。"
      - op: "say"
        who: "伊芙"
        portrait: "温柔"
        pos: "right"
        text: "你，已经死了。"
      - op: "narrate"
        text: "她说得很轻，像在念一句早就准备好的祝词。"
      - op: "narrate"
        text: "陆择没有立刻反驳。他低头看了看自己被云雾遮蔽的身体，又看了看她那身整齐的薄纱。"
      - op: "say"
        who: "陆择"
        portrait: "沉吟"
        pos: "left"
        text: "……有点意思。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你将经历六个试炼。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "每一个，三十天。你的灵魂会穿越进一具身体，去拯救一个即将陨落的弱者。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你只能在关键的选择处干预。不能改写日常，不能插手命运的细枝末节。"
      - op: "say"
        who: "陆择"
        portrait: "沉吟"
        pos: "left"
        text: "……为什么是我？"
      - op: "say"
        who: "伊芙"
        portrait: "浅笑"
        pos: "right"
        text: "这个嘛——"
      - op: "narrate"
        text: "她笑了一下，把那半句轻轻收住，像把一片云塞回天上。"
      - op: "say"
        who: "伊芙"
        portrait: "浅笑"
        pos: "right"
        text: "到时候，你就知道啦。"
      - op: "say"
        who: "伊芙"
        portrait: "浅笑"
        pos: "right"
        text: "第一个试炼，要开始了。愿光指引你的归途。"
      - op: "narrate"
        text: "亮光从四面八方涌过来，吞没云雾，吞没少女，也吞没他刚刚死去的那个雨夜。"
      - op: "jump"
        file: "chapter01_新皮肤"
