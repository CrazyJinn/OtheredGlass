meta:
  chapter: 0
  title: "序章"
  requires:
    characters:
      - "陆择"
      - "顾盈"
      - "伊芙"
    scenes:
      - "酒店-客房"
      - "马路-路口"
      - "灵魂夹缝-夹缝空间"
    portraits:
      - "陆择.局促"
      - "陆择.走神"
      - "陆择.茫然"
      - "顾盈.慵懒"
      - "伊芙.庄严"

scenes:
  - id: "酒店"
    scene: "酒店-客房"
    time: "清晨"
    bgm:
      track: "晨离"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "天花板是陌生的白，窗外晨光泛着冷蓝。"
      - op: "narrate"
        text: "浴室方向传来水声。"
      - op: "narrate"
        text: "陆择撑着额角坐起来，头疼还在。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "醒了?"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "昨晚可不是这个状态。"
      - op: "say"
        who: "陆择"
        portrait: "局促"
        pos: "left"
        text: "呵……有意思。"
      - op: "say"
        who: "陆择"
        portrait: "局促"
        pos: "left"
        text: "宿醉嘛，让我缓缓。"
      - op: "narrate"
        text: "水声停了。顾盈从浴室走出来，身上套着他的白衬衫，下摆盖过膝盖。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "手机给我一下?扫个微信。"
      - op: "say"
        who: "陆择"
        portrait: "局促"
        pos: "left"
        text: "这个嘛……"
      - op: "say"
        who: "陆择"
        portrait: "局促"
        pos: "left"
        text: "我下午的飞机，要离开这座城市。"
      - op: "say"
        who: "陆择"
        portrait: "局促"
        pos: "left"
        text: "加了也聊不上几次，挺可惜的。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "嗯?"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "那昨晚岂不是更可惜。"
      - op: "narrate"
        text: "陆择笑了一下，没接。"
      - op: "narrate"
        text: "他绕到床尾捡起开衫套在身上。衬衫留在顾盈那里，他没要回来。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "……行吧。"
      - op: "say"
        who: "顾盈"
        portrait: "慵懒"
        pos: "right"
        text: "你这种赶时间的人，最没意思。"
      - op: "narrate"
        text: "陆择已经摸到了门把手，没回头。"

  - id: "路口"
    scene: "马路-路口"
    time: "阴天白天"
    bgm:
      track: "雨路"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "雨没停，路口的积水把霓虹泡成糊状的光。"
      - op: "narrate"
        text: "陆择撑着伞站在斑马线一侧，开衫被雨打湿了一片。"
      - op: "narrate"
        text: "红灯跳绿。他随人群迈下路牙。"
      - op: "narrate"
        text: "一辆失控的车冲过雨幕。没有刹车声。"
      - op: "narrate"
        text: "世界黑了。"

  - id: "夹缝"
    scene: "灵魂夹缝-夹缝空间"
    time: "白天"
    bgm:
      track: "光隙"
      mode: "play"
      loop: true
    lines:
      - op: "narrate"
        text: "光从四面渗进来，整个空间都是白的。"
      - op: "narrate"
        text: "脚下没有地，只有云雾缓缓流过。"
      - op: "narrate"
        text: "陆择低头看自己——上身的衣物不见了，白云缠在腰间，赤足悬在光里。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "……有意思。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "这是哪?"
      - op: "narrate"
        text: "光粒在前方收拢，凝出一个轮廓——月白薄纱，发梢泛着柔光。"
      - op: "show"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "晨光的……嗯，祝福，降临于你。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "那个，让我想想该从哪里说起——"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你死了。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "呵。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "那现在算什么?"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你的灵魂走到了夹缝。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "还没到归处，也回不到人间。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "听起来我还有的选?"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "愿光指引你的归途——"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你接下来要经历六次试炼。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "每一次三十天，你的灵魂会穿越到一个弱者身边。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你只能在他们的关键选择处伸手。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "其余时刻，是旁观。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "拯救弱者，却只能旁观。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "那规则是谁定的?"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "那个……这个我没办法回答你。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你只需要知道规则本身。"
      - op: "say"
        who: "陆择"
        portrait: "茫然"
        pos: "left"
        text: "那你又是谁?"
      - op: "narrate"
        text: "伊芙低头，没答。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "你的第一次试炼就要开始了。"
      - op: "say"
        who: "伊芙"
        portrait: "庄严"
        pos: "right"
        text: "愿光指引你——阿门。"
      - op: "narrate"
        text: "云雾散开，光粒扑面而来。"
      - op: "jump"
        file: "chapter01_新皮肤"
